<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راصد عُمان المطور | الرصد الذكي</title>
    
    <!-- استدعاء مكتبة البوتستراب -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    
    <!-- استدعاء خط كايرو وأيقونات بوتستراب -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        /* تطبيق خط كايرو على كامل الموقع */
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #f0f4f8; 
        }
        
        .hero { 
            background: linear-gradient(135deg, #1a73e8, #0052cc); 
            color: white; 
            padding: 60px 0; 
            text-align: center; 
            border-bottom-left-radius: 50px; 
            border-bottom-right-radius: 50px;
        }
        
        /* تنسيق الأيقونة */
        .app-icon { 
            width: 120px; 
            height: 120px; 
            border-radius: 25px; 
        }

        /* تنسيق أزرار التحميل */
        .download-btn {
            padding: 12px 25px;
            font-weight: 700;
            border-radius: 30px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-chrome {
            background-color: #ffffff;
            color: #1a73e8;
        }

        .btn-chrome:hover {
            background-color: #e8f0fe;
            color: #0052cc;
            transform: translateY(-2px);
        }

        .btn-firefox {
            background-color: #ff7139;
            color: #ffffff;
        }

        .btn-firefox:hover {
            background-color: #e0531c;
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* تنسيق قسم الفيديو */
        .video-section {
            padding: 40px 0;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* نسبة العرض الارتفاع 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <!-- قسم البانر الرئيسي -->
    <div class="hero">
        <div class="container">
            <h1 class="display-5 fw-bold mb-3">إضافة راصد عُمان المطور</h1>
            <p class="lead mb-4">الحل الأمثل لرصد درجات الطلاب تلقائياً من ملفات الإكسيل على منصة نور والبوابة التعليمية[cite: 1].</p>
            
            <!-- أزرار تحميل الأداة -->
            <div class="d-flex justify-content-center gap-3 flex-wrap my-4">
                <a href="#" class="download-btn btn-chrome">
                    <i class="bi bi-browser-chrome fs-5"></i>
                    تثبيت لمتصفح كروم / إيدج
                </a>
                <a href="#" class="download-btn btn-firefox">
                    <i class="bi bi-browser-firefox fs-5"></i>
                    تثبيت لمتصفح فايرفوكس
                </a>
            </div>
        </div>
    </div>

    <!-- قسم شرح الفيديو -->
    <div class="container video-section">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center">
                <h3 class="mb-4 fw-bold text-dark">شاهد فيديو الطريقة وشرح الاستخدام</h3>
                <div class="video-container">
                    <iframe src="https://www.youtube.com/embed/3qtJYhzDD5c" title="شرح إضافة رصد" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- استدعاء سكريبت البوتستراب -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
